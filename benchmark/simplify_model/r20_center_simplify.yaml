# Simplification retrosynthesis: r=0 templates filtered to fragmentation
# (product always decomposes into simpler precursors).
# Joint template + reaction-center head. num_classes auto-set from meta.json.

run_name: r20_center_simplify
seed: 42

data:
  processed_dir: data/processed_r20_center_simplify
  featurized_dir: data/featurized_r20_center_simplify
  num_workers: 8
  pin_memory: true

model:
  # ATOM_FDIM=42, BOND_FDIM=12 are fixed by featurize.py
  hidden_dim: 300
  depth: 3
  dropout: 0.1
  num_classes: 42028                     # auto-overridden by meta.json at runtime
  readout: sum
  head_hidden: 600
  head_dropout: 0.2
  predict_center: true
  center_head_hidden: 128

train:
  batch_size: 256
  epochs: 30
  optimizer: adamw
  lr: 1.0e-3
  weight_decay: 1.0e-5
  warmup_steps: 2000
  scheduler: cosine
  label_smoothing: 0.1
  center_loss_weight: 1.0
  center_pos_weight: 25.0                # ~1/center_density (~4% atoms are centers)
  grad_clip: 5.0
  amp: true
  log_every: 100
  val_every: 1
  early_stop_patience: 5
  ddp: false
  init_weights: runs/r20_center/best_enc.pt  # warm-start encoder+center head (classifier head reinit)

eval:
  top_k: [1, 5, 10, 50]
  batch_size: 512

output:
  runs_dir: runs
  tb_subdir: tb
  ckpt_best: best.pt
  ckpt_last: last.pt
